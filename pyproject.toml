[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rsa-lifecycle-2048"
version = "1.1.0"
description = "Educational 2048-bit RSA lifecycle vulnerability demonstrations"
requires-python = ">=3.10"
dependencies = ["cryptography>=41,<50", "sympy>=1.12,<2"]

[tool.setuptools.packages.find]
include = ["rsa_lab*"]
