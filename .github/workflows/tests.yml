name: Verify RSA lab
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test four-act RSA demo, batch GCD, cube-root extension and controls
        run: python -m unittest discover -s tests -v
      - name: Run combined demonstration
        run: python -m rsa_lab --no-pause
